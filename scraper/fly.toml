# fly.toml app configuration file generated for otopair-scraper on 2026-08-03T14:30:01-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'otopair-scraper'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/health'

# Headless Chromium needs real headroom. The Dockerfile documented ">=1GB for
# the browser tier" and this was set to exactly that minimum, which leaves the
# stealth tier one heavy page away from an OOM kill — a 502 indistinguishable
# from the missing-binary 502 that was actually happening. Machines auto-stop
# at zero traffic (min_machines_running = 0), so the idle cost of the headroom
# is nil.
[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
